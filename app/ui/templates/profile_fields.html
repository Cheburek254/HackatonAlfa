<div class="profile-fields">
    {% for field, (label, options) in profile_fields.items() %}
    <label for="{{ field }}">
        {{ label }}
        <select name="{{ field }}" id="{{ field }}">
            <option value="">Любой вариант</option>
            {% for option in options %}
            <option value="{{ option }}"{% if profile_values[field] == option %} selected{% endif %}>{{ option | capitalize }}</option>
            {% endfor %}
        </select>
    </label>
    {% endfor %}
</div>
