<div id="alfa-chat-widget" class="alfa-chat-widget" data-user-id="{{ current_account().id if current_account and current_account() else 'guest' }}">
    <button id="alfa-chat-trigger" class="alfa-chat-trigger" type="button" aria-label="Открыть чат с ИИ-помощником" aria-expanded="false">
        <svg class="chat-icon-open" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <svg class="chat-icon-close" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
    </button>

    <div id="alfa-chat-window" class="alfa-chat-window" role="dialog" aria-labelledby="chat-header-title">
        <div class="alfa-chat-header">
            <button id="alfa-chat-close-btn" class="chat-header-close" type="button" aria-label="Закрыть чат" title="Закрыть">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
            <div class="chat-header-info">
                <span id="chat-header-title" class="chat-header-title">ИИ-помощник Альфа-Курс</span>
            </div>
            <div class="chat-header-actions">
                <button id="alfa-chat-reset-btn" class="chat-header-reset" type="button" aria-label="Начать новый диалог" title="Очистить историю диалога">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
                        <path d="M21 3v5h-5"/>
                        <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
                        <path d="M3 21v-5h5"/>
                    </svg>
                </button>
                <div class="chat-header-badge" title="ИИ-помощник онлайн" aria-label="ИИ-помощник онлайн">
                    <span class="badge-dot"></span>
                </div>
            </div>
        </div>

        <div id="alfa-chat-messages" class="alfa-chat-messages" role="log" aria-live="polite">
            <div class="chat-message chat-message-assistant">
                <div class="message-bubble">
                    Здравствуйте! Я ИИ-помощник образовательной платформы <strong>«Альфа-Курс»</strong>.<br><br>
                    Помогу разобраться с бизнес-задачей, подберу практические курсы, статьи или шаблоны документов. С чего хотите начать?
                </div>
            </div>

            <div id="chat-quick-replies" class="chat-quick-replies" aria-label="Быстрые вопросы">
                <button type="button" class="quick-reply-pill" data-prompt="Моё обучение на Альфа-Курсе">Моё обучение на Альфа-Курсе</button>
                <button type="button" class="quick-reply-pill" data-prompt="Хочу начать учиться">Хочу начать учиться</button>
                <button type="button" class="quick-reply-pill" data-prompt="Как поднять продажи и привлечь клиентов?">Как поднять продажи</button>
                <button type="button" class="quick-reply-pill" data-prompt="Посоветуй готовые шаблоны и таблицы для учета">Шаблоны для учета</button>
                <button type="button" class="quick-reply-pill" data-prompt="Техническая проблема">Техническая проблема</button>
            </div>
        </div>

        <div id="alfa-chat-typing" class="alfa-chat-typing">
            <div class="typing-bubble">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
            <span class="typing-text">ИИ-помощник печатает...</span>
        </div>

        <form id="alfa-chat-form" class="alfa-chat-input-row" autocomplete="off">
            <label for="alfa-chat-input" class="sr-only">Введите сообщение</label>
            <textarea id="alfa-chat-input" class="chat-input" rows="1" placeholder="Введите сообщение..." maxlength="1000" required></textarea>
            <button id="alfa-chat-send" class="chat-send-btn" type="submit" aria-label="Отправить">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="12" y1="19" x2="12" y2="5"/>
                    <polyline points="5 12 12 5 19 12"/>
                </svg>
            </button>
        </form>
    </div>
</div>
