<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111111">
    <title>{% block title %}Подборка для бизнеса — Альфа-Курс{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='recommendations.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="wrap masthead">
            <a class="wordmark" href="{{ url_for('index') }}">
                <svg viewBox="0 0 32 28" width="32" height="28" aria-hidden="true">
                    <path fill="currentColor" d="M16 2 31 9.5 16 17 1 9.5 16 2Zm-9 13 9 4.5 9-4.5v6l-9 5-9-5v-6Z"/>
                    <path d="M29 11v8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span>Альфа-Курс</span>
            </a>
            <div class="header-actions">
                <span class="demo-label">Демо подбора</span>
                <a class="profile-link" href="{{ url_for('profile_page') }}"{% if request.endpoint in ('profile_page', 'profile_settings') %} aria-current="page"{% endif %}>
                    <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                        <circle cx="10" cy="6.25" r="3"/>
                        <path d="M4 16v-.75A3.25 3.25 0 0 1 7.25 12h5.5A3.25 3.25 0 0 1 16 15.25V16" stroke-linecap="round"/>
                    </svg>
                    Профиль
                </a>
            </div>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="wrap footer-content">
            <span>Альфа-Курс <span class="footer-dot">·</span> Демо подбора</span>
            <span>Демонстрационные материалы и ссылки</span>
        </div>
    </footer>
</body>
</html>
