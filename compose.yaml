name: alfahack-demo

services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PUBLIC_PORT:-18081}:8080"
    environment:
      ALFA_SECRET_KEY: ${ALFA_SECRET_KEY:-}
      ALFA_CATALOG_DIR: ${ALFA_CATALOG_DIR:+/app/data}
      ALFA_LLM_API_KEY: ${ALFA_LLM_API_KEY:-}
      ALFA_LLM_MODEL: ${ALFA_LLM_MODEL:-gemini-3.5-flash-lite}
      ALFA_BM25_WEIGHT: ${ALFA_BM25_WEIGHT:-0.25}
      ALFA_CHAT_BM25_WEIGHT: ${ALFA_CHAT_BM25_WEIGHT:-0.25}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-3.5-flash-lite}
    volumes:
      - accounts:/var/lib/alfahack
      - ${ALFA_CATALOG_DIR:-./data}:/app/data:ro

volumes:
  accounts:
