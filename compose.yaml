name: alfahack-demo

services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PUBLIC_PORT:-18081}:8080"
    environment:
      ALFA_SECRET_KEY: ${ALFA_SECRET_KEY:-}
      ALFA_CATALOG_DIR: ${ALFA_CATALOG_DIR:+/app/data}
      ALFA_LLM_API_KEY: ${ALFA_LLM_API_KEY:-}
      ALFA_LLM_MODEL: ${ALFA_LLM_MODEL:-gemini-2.5-flash}
    volumes:
      - accounts:/var/lib/alfahack
      - ${ALFA_CATALOG_DIR:-./data}:/app/data:ro

volumes:
  accounts:
